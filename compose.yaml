services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-hub-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - nexus-data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/nexus.db
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - DEBUG=false
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-hub-frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexus-data: